[package]
name = "metru-dev"
version = "0.1.0"
authors = ["Sam Zanca <sam@zanca.dev>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = ["router", "fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
markdown = "1"
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy", "default-themes", "default-syntaxes", "parsing", "html"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
ureq = { version = "2", features = ["json"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }

[build-dependencies]
octocrab = "0.44"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server", "dep:ureq", "dep:image"]
