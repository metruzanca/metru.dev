[package]
name = "lab-timezones"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.1" }
ui = { path = "../../ui" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Location", "History", "Document", "Element", "DomRect"] }
